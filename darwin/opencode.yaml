darwin:
  opencode:
    agent:
      build:
        model: amazon-bedrock/us.anthropic.claude-sonnet-5
        temperature: 0.1
        permission:
          bash: allow
          edit: allow
      review:
        model: amazon-bedrock/us.anthropic.claude-sonnet-5
        temperature: 0.1
      plan:
        model: amazon-bedrock/us.anthropic.claude-opus-5
        temperature: 0.1
        permission:
          bash: deny
          edit: deny
    mcp:
      proxy:
        enabled: true
        type: remote
        url: http://127.0.0.1:3000/mcp
    models:
      default: amazon-bedrock/us.anthropic.claude-sonnet-4-6
      default-small: amazon-bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
    plugins:
      - context-mode
      - superpowers@git+https://github.com/obra/superpowers.git
    provider:
      amazon-bedrock:
        models:
          amazon-bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0: {}
          amazon-bedrock/us.anthropic.claude-sonnet-4-6: {}
          amazon-bedrock/us.anthropic.claude-opus-4-8: {}
          options:
            region: us-west-2
