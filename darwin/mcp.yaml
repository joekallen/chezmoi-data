darwin:
  mcp:
    atlassian:
      url: https://mcp.atlassian.com/v1/mcp
      idle_timeout: never
    aws-api:
      command: uvx
      args: ['awslabs.aws-api-mcp-server>=1.3,<1.4']
      idle_timeout: adaptive
      env:
        AWS_PROFILE: infra
        AWS_REGION: us-west-2
        FASTMCP_LOG_LEVEL: ERROR
    aws-cloudwatch:
      command: uvx
      args: ['awslabs.cloudwatch-mcp-server>=0.1,<0.2']
      idle_timeout: adaptive
      env:
        AWS_PROFILE: infra
        AWS_REGION: us-west-2
        FASTMCP_LOG_LEVEL: ERROR
    aws-eks:
      command: uvx
      args: ['awslabs.eks-mcp-server>=0.1,<0.2']
      idle_timeout: adaptive
      environment:
        AWS_PROFILE: infra
        AWS_REGION: us-west-2
        FASTMCP_LOG_LEVEL: ERROR
    glab:
      command: op
      args: [run, --, glab, mcp, serve]
      idle_timeout: adaptive
      env:
        GITLAB_TOKEN: 'op://Subsplash/GitLab PAT/credential'
    grafana:
      url: https://grafana-mcp.infra.subsplash.io/mcp
      idle_timeout: never
    opentofu:
      command: npx
      args: [-y, '@opentofu/opentofu-mcp-server@latest']
      idle_timeout: adaptive
    terraform:
      command: podman
      args: [run, -i, --rm, hashicorp/terraform-mcp-server:0.5.2]
      idle_timeout: adaptive
    unblocked:
      url: https://getunblocked.com/api/mcpsse
      idle_timeout: never
